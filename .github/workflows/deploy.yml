name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: http://coolify.82.165.163.62.nip.io
          COOLIFY_APP_UUID: u13eg070u723zaf11n10nyoy
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::Missing COOLIFY_TOKEN secret. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          response=$(curl -fsS -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          echo "Coolify response: ${response}"
          echo "Triggered Coolify deployment for commit ${GITHUB_SHA}"
