name: Deploy to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          # Site statique SvelteKit
          cp -r build/* deploy/
          # API PHP
          cp -r api deploy/api
          # .htaccess principal
          cp static/.htaccess deploy/.htaccess 2>/dev/null || true

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 22
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: ./deploy/*
          remote_path: /
          sftp_only: true
          delete_remote_files: false
